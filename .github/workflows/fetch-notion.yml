name: Sync Notion Post Daily

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  notion-async:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create .env.local from GitHub Secrets
        run: |
          echo "NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}" >> .env.local
          echo "BLOGS_DATABASE_ID=${{ secrets.BLOGS_DATABASE_ID }}" >> .env.local
          echo "PROJECTS_DATABASE_ID=${{ secrets.PROJECTS_DATABASE_ID }}" >> .env.local

      - name: Run Notion sync
        run: npm run sync:notion

      - name: Commit & Push changes (if any)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git config credential.helper store
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "synce Notion posts"
            git push origin HEAD:main
          fi